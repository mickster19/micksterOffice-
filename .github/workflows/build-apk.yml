name: Build micksterOffice APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          set -e
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y wget unzip python3 python3-pil libc6:i386 libstdc++6:i386 zlib1g:i386

          mkdir -p android-src/app/src/main/assets \
                   android-src/app/src/main/java/com/mickster/office \
                   android-src/app/src/main/res/mipmap-xxxhdpi

          cp index.html android-src/app/src/main/assets/index.html

          python3 - << 'PY'
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (192, 192), (7, 11, 20, 255))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([14, 14, 178, 178], radius=40, fill=(15, 23, 42, 255), outline=(0, 240, 255, 255), width=6)
          d.rounded_rectangle([34, 58, 158, 126], radius=16, fill=(0, 210, 255, 255))
          d.ellipse([48, 118, 76, 146], fill=(2, 6, 23, 255))
          d.ellipse([116, 118, 144, 146], fill=(2, 6, 23, 255))
          img.save("android-src/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          PY

          cat << 'MANIFEST' > android-src/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mickster.office">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="micksterOffice" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat << 'JAVA' > android-src/app/src/main/java/com/mickster/office/MainActivity.java
          package com.mickster.office;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView wv = new WebView(this);
              setContentView(wv);
              WebSettings ws = wv.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("file:///android_asset/index.html");
            }
          }
          JAVA

          export ANDROID_HOME=$PWD/android-sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"

          mkdir -p cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d cmdline-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

          mkdir -p compiled-res gen-src classes dex-out
          aapt2 compile --dir android-src/app/src/main/res -o compiled-res/
          aapt2 link -o app-unaligned.apk \
            -I "$ANDROID_HOME/platforms/android-34/android.jar" \
            --manifest android-src/app/src/main/AndroidManifest.xml \
            -A android-src/app/src/main/assets \
            --java gen-src \
            compiled-res/*.flat

          find android-src/app/src/main/java gen-src -name "*.java" > sources.txt
          javac -source 17 -target 17 -cp "$ANDROID_HOME/platforms/android-34/android.jar" -d classes @sources.txt
          d8 --lib "$ANDROID_HOME/platforms/android-34/android.jar" --output dex-out $(find classes -name "*.class")
          cp dex-out/classes.dex .
          zip -qj app-unaligned.apk classes.dex
          zipalign -p -f 4 app-unaligned.apk app-aligned.apk

          keytool -genkeypair -v -keystore /tmp/debug.jks -alias androidkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Mickster, OU=micksterOffice, O=TZBus, L=Mbeya, S=Mbeya, C=TZ"
          apksigner sign --ks /tmp/debug.jks --ks-key-alias androidkey \
            --ks-pass pass:android --key-pass pass:android \
            --out micksterOffice.apk app-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micksterOffice-APK
          path: micksterOffice.apk
